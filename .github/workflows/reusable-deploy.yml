name: Reusable Deploy Workflow

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.12.0

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1
        with:
          config: ./cluster.yml

      - name: Helm Install (Dry Run)
        run: |
          helm install --dry-run --debug todo-release ./helm-charts/todoapp \
            --set image.repository=${{ secrets.DOCKERHUB_USERNAME }}/todo-app \
            --set image.tag=latest

      - name: Helm Upgrade --install (Atomic)
        run: |
          helm upgrade --install todo-release ./helm-charts/todoapp \
            --atomic \
            --wait \
            --timeout 5m \
            --set image.repository=${{ secrets.DOCKERHUB_USERNAME }}/todo-app \
            --set image.tag=latest